name: CI - MarketplaceERP

on:
  push:
    branches:
      - main
      - develop
      - 'fix/**'
      - 'staging/**'
  pull_request:
    branches:
      - main
      - develop
      - 'staging/**'

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_PG_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgrespassword"

    steps:
      # 1. Checkout del cÃ³digo
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Configurar .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # 3. Restaurar dependencias NuGet
      - name: Restore NuGet packages
        run: dotnet restore MarketplaceERP.sln

      # 4. Build en modo Release
      - name: Build solution
        run: dotnet build MarketplaceERP.sln --no-restore --configuration Release

      # 4.1 Validar que TEST_PG_CONNECTION estÃ© configurada
      - name: Verify TEST_PG_CONNECTION is set
        run: |
          if [ -z "$TEST_PG_CONNECTION" ]; then
            echo "ERROR: TEST_PG_CONNECTION is not set!"
            exit 1
          fi

      # 5. Ejecutar tests unitarios
      - name: Run tests
        run: dotnet test MarketplaceERP.sln --no-build --configuration Release --logger "trx;LogFilePrefix=test-results" --results-directory ./TestResults

      # Preservar reportes TRX sin depender de una accion Node 20 obsoleta.
      - name: Upload test results (TRX)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

  build-frontend:
    name: Build Frontend (Node 24)
    runs-on: ubuntu-24.04

    steps:
      # 6. Checkout del cÃ³digo
      - name: Checkout
        uses: actions/checkout@v6

      # 7. Configurar Node.js 24
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Contrato P0 del runner externo: nunca ejecuta escrituras en CI.
      - name: Validate P0 staging acceptance runner
        run: |
          node --check scripts/p0-staging-acceptance.mjs
          node scripts/p0-staging-acceptance.mjs --help

      - name: Validate P1 staging auth runner (syntax/help only)
        run: |
          node --check scripts/p1-staging-auth-readonly.mjs
          node scripts/p1-staging-auth-readonly.mjs --help
          node --check frontend/marketplace-ui/tests/e2e-staging-preview.mjs

      # 8. Instalar dependencias npm
      - name: Install npm dependencies
        working-directory: frontend/marketplace-ui
        run: npm ci

      # P1: clasificar dependencias runtime vs dev con auditoria de solo lectura.
      # No hacer npm audit fix, ni bloquear el CI sin revisar los advisories.
      - name: Classify npm security advisories (non-mutating)
        run: node scripts/p1-audit-dependencies.mjs

      # 9. Verificar contratos de autenticacion y checkout
      - name: Test frontend auth
        working-directory: frontend/marketplace-ui
        run: npm run test:auth

      - name: Test frontend checkout
        working-directory: frontend/marketplace-ui
        run: npm run test:checkout

      # 10. Build del frontend
      - name: Test P3 catalog pagination and KPI exports
        working-directory: frontend/marketplace-ui
        run: npm run test:p3

      - name: Lint frontend
        working-directory: frontend/marketplace-ui
        run: npm run lint
      - name: Build frontend
        working-directory: frontend/marketplace-ui
        run: npm run build

      # Subir artefactos del build
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/marketplace-ui/dist/
          retention-days: 7


  browser-e2e:
    name: E2E Browser (isolated Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONNECTION_STRING: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgrespassword"
      ADMIN_EMAIL: "p1-ci-admin@erp.invalid"
      Payments__Provider: "Disabled"
      Payments__EnableMock: "false"
      ASPNETCORE_ENVIRONMENT: "Development"
      PORT: "5000"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Generate one-time local CI auth values
        run: |
          TEST_PASSWORD="$(openssl rand -hex 24)"
          TEST_JWT_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$TEST_PASSWORD"
          echo "::add-mask::$TEST_JWT_KEY"
          echo "ADMIN_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          echo "Jwt__Key=$TEST_JWT_KEY" >> "$GITHUB_ENV"

      - name: Install UI dependencies
        working-directory: frontend/marketplace-ui
        run: npm ci

      - name: Install isolated browser runner
        working-directory: frontend/marketplace-ui
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test real browser with mock API only
        working-directory: frontend/marketplace-ui
        run: node tests/e2e-auth-browser.mjs

      - name: Build .NET API for local full-stack E2E
        run: |
          dotnet restore MarketplaceERP.sln
          dotnet build src/MarketplaceERP.API/MarketplaceERP.API.csproj --configuration Release --no-restore

      - name: Migrate and bootstrap disposable PostgreSQL only
        run: |
          DESCRIBE=$(dotnet run --project src/MarketplaceERP.API/MarketplaceERP.API.csproj --configuration Release --no-build --no-launch-profile -- --describe-maintenance-target)
          FP=$(printf '%s\n' "$DESCRIBE" | awk -F ': ' '/Target fingerprint:/{print $2}')
          if ! [[ "$FP" =~ ^[A-F0-9]{64}$ ]]; then
            echo "Invalid maintenance target fingerprint"; exit 1
          fi
          for ACTION in migrate bootstrap-admin; do
            dotnet run --project src/MarketplaceERP.API/MarketplaceERP.API.csproj --configuration Release --no-build --no-launch-profile -- \
              "--maintenance=$ACTION" \
              "--expected-host=localhost" \
              "--expected-port=5432" \
              "--expected-database=postgres" \
              "--confirm-target=$FP"
          done

      - name: Start real local ASP.NET API
        run: |
          nohup dotnet run --project src/MarketplaceERP.API/MarketplaceERP.API.csproj \
            --configuration Release --no-build --no-launch-profile \
            > /tmp/p1-local-api.log 2>&1 &
          for i in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:5000/health/ready > /dev/null; then
              echo "Local API ready"; exit 0
            fi
            sleep 0.3
          done
          echo "Local API did not become ready"
          tail -n 35 /tmp/p1-local-api.log
          exit 1

      - name: Test real Admin JWT in Chromium + local PostgreSQL
        working-directory: frontend/marketplace-ui
        run: node tests/e2e-live-local-api.mjs
