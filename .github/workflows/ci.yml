name: CI - MarketplaceERP

on:
  push:
    branches:
      - main
      - development
      - 'fix/**'
      - 'staging/**'
  pull_request:
    branches:
      - main
      - development
      - 'staging/**'

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_PG_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgrespassword"

    steps:
      # 1. Checkout del cÃ³digo
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Configurar .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # 3. Restaurar dependencias NuGet
      - name: Restore NuGet packages
        run: dotnet restore MarketplaceERP.sln

      # F273: ningún proyecto de la solución debe resolver NuGet vulnerables.
      # La auditoría es de lectura: no ejecuta actualización automática.
      - name: Audit full solution NuGet dependencies (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          dotnet list MarketplaceERP.sln package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/nuget-audit.json"
          jq -e '(.projects | type == "array" and length > 0)' "$RUNNER_TEMP/nuget-audit.json" > /dev/null
          jq -e '[.projects[] | (.frameworks // [])[] | ((.topLevelPackages // []) + (.transitivePackages // []))[] |
            select(((.vulnerabilities // []) | length) > 0)] | length == 0'             "$RUNNER_TEMP/nuget-audit.json" > /dev/null
          echo "F273_NUGET_AUDIT_PASS"

      # 4. Build en modo Release
      - name: Build solution (QA harness for test compilation)
        run: dotnet build MarketplaceERP.sln --no-restore --configuration Release -p:CheckoutQaHarness=true -m:1

      # 4.1 Validar que TEST_PG_CONNECTION estÃ© configurada
      - name: Verify TEST_PG_CONNECTION is set
        run: |
          if [ -z "$TEST_PG_CONNECTION" ]; then
            echo "ERROR: TEST_PG_CONNECTION is not set!"
            exit 1
          fi

      # 5. Ejecutar tests unitarios
      - name: Run tests
        run: dotnet test MarketplaceERP.sln --no-build --configuration Release --logger "trx;LogFilePrefix=test-results" --results-directory ./TestResults

      # Verificar aparte el ensamblado desplegable sin controladores ni helpers QA.
      - name: Build production API without QA harness
        run: dotnet build src/MarketplaceERP.API/MarketplaceERP.API.csproj --no-restore --configuration Release -p:CheckoutQaHarness=false

      # Las pruebas nunca deben reescribir el CSV versionado del catálogo de 500 SKUs.
      - name: Assert catalog fixture did not overwrite tracked CSV
        if: always()
        run: |
          git diff --exit-code -- docs/data/Catalogo_500_Productos.csv
          if [ -n "$(git status --porcelain --untracked-files=no -- docs/data/Catalogo_500_Productos.csv)" ]; then
            echo "::error::A test modified the tracked 500-product CSV"; exit 1
          fi

      # Preservar reportes TRX sin depender de una accion Node 20 obsoleta.
      - name: Upload test results (TRX)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

  build-frontend:
    name: Build Frontend (Node 24)
    runs-on: ubuntu-24.04

    steps:
      # 6. Checkout del cÃ³digo
      - name: Checkout
        uses: actions/checkout@v6

      # 7. Configurar Node.js 24
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # F304: prueba exactamente los comandos de aprobacion del gate de Vercel,
      # con 'gh' y 'curl' falsos en un directorio temporal (sin red ni Production).
      - name: F304 release gate fail-closed contract (18 offline scenarios)
        run: node scripts/f304-release-gate-contract.mjs

      # Contrato P0 del runner externo: nunca ejecuta escrituras en CI.
      - name: Validate P0 staging acceptance runner
        run: |
          node --check scripts/p0-staging-acceptance.mjs
          node scripts/p0-staging-acceptance.mjs --help

      - name: Validate P1 staging auth runner (syntax/help only)
        run: |
          node --check scripts/p1-staging-auth-readonly.mjs
          node scripts/p1-staging-auth-readonly.mjs --help
          node --check frontend/marketplace-ui/tests/e2e-staging-preview.mjs

      # F371: offline contract of the read-only DEV health/ready monitor.
      - name: Test F371 Render Development health monitor without network
        run: node scripts/f371-readiness-monitor.mjs --self-test

      # F372: fail closed if cookie/antiforgery/TempData DataProtection consumers are added.
      - name: F372 static DataProtection consumer gate
        run: node scripts/f372-dataprotection-consumers.mjs --self-test

      # 8. Instalar dependencias npm
      - name: Install npm dependencies
        working-directory: frontend/marketplace-ui
        run: npm ci

      # F273: dependencias usadas en producción deben estar libres de HIGH/CRITICAL.
      - name: Audit frontend production npm dependencies
        working-directory: frontend/marketplace-ui
        run: npm audit --omit=dev --audit-level=high

      # F344: incluir también herramientas de desarrollo y detener vulnerabilidades moderadas o superiores.
      # Se habilita tras verificar F342/F343 con npm audit completo = 0; no aplicar fix/overrides automáticos.
      - name: Audit complete npm dependency graph (including dev)
        working-directory: frontend/marketplace-ui
        run: npm audit --audit-level=moderate

      # P1: clasificar dependencias runtime vs dev con auditoría adicional de solo lectura.
      # No ejecutar cambios de lockfile durante CI.
      - name: Classify npm security advisories (non-mutating)
        run: node scripts/p1-audit-dependencies.mjs

      # F484: independent offline NO-GO on mismatched Production SHAs,
      # broken restores, missing owner approval or active DB writers.
      - name: F484 production cutover evidence gate (pure offline fixtures)
        run: node scripts/f484-production-evidence-gate.test.mjs

      # 9. Verificar contratos de autenticacion y checkout
      - name: Test frontend auth
        working-directory: frontend/marketplace-ui
        run: npm run test:auth

      - name: Test frontend checkout
        working-directory: frontend/marketplace-ui
        run: npm run test:checkout

      # F666: a confirmed OMS 201 may have an empty body behind the proxy.
      - name: Test OMS evaluation submit and pending unlock
        working-directory: frontend/marketplace-ui
        run: node tests/oms-evaluation-submit-check.cjs

      # F396: pure barcode / scanner contracts from colleague fork; no DB or external network.
      - name: F396 EAN-13 and scan result tests
        working-directory: frontend/marketplace-ui
        run: |
          node tests/ean13.test.cjs
          node tests/resultado-lectura.test.cjs

      # 10. Build del frontend
      - name: Test P3 catalog pagination and KPI exports
        working-directory: frontend/marketplace-ui
        run: npm run test:p3

      - name: Lint frontend
        working-directory: frontend/marketplace-ui
        run: npm run lint
      - name: Validate P5 backup script syntax (no database access)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/p5-backup-restore-safe.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Parse consolidation PowerShell scripts (no execution)
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/consolidacion-preflight.ps1',
            'scripts/consolidacion-backup-bundle.ps1',
            'scripts/analizar-cambios-worktrees.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "$path : $($parseErrors | Out-String)" }
          }

      - name: Smoke-test local worktree comparison in disposable Git repo
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP ('erp-worktrees-' + [Guid]::NewGuid().ToString('N'))
          $testRepo = Join-Path $base 'repo'
          $testOutput = Join-Path $base 'output'
          $secondWorktree = Join-Path $base 'linked'
          New-Item -ItemType Directory -Path $base, $testOutput -Force | Out-Null
          git init $testRepo | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          git -C $testRepo config user.email 'ci@erp.invalid'
          git -C $testRepo config user.name 'CI worktree smoke'
          'original' | Set-Content (Join-Path $testRepo 'tracked.txt')
          git -C $testRepo add tracked.txt
          git -C $testRepo commit -m 'smoke baseline' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'baseline commit failed' }
          git -C $testRepo branch candidate
          git -C $testRepo branch staging
          git -C $testRepo worktree add -b second-worktree $secondWorktree HEAD | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'linked worktree failed' }
          'local changed content' | Set-Content (Join-Path $testRepo 'tracked.txt')
          'new only local' | Set-Content (Join-Path $secondWorktree 'local_only.txt')
          & ./scripts/analizar-cambios-worktrees.ps1 -Repo $testRepo -Destino $testOutput -RamaCandidata 'candidate' -RamaStaging 'staging'
          if (-not $?) { throw 'comparison script failed' }
          $reportDir = @(Get-ChildItem -LiteralPath $testOutput -Directory | Sort-Object Name -Descending)[0].FullName
          $files = @(Import-Csv (Join-Path $reportDir 'Archivos_Comparados.csv'))
          $summary = @(Import-Csv (Join-Path $reportDir 'Resumen_Worktrees.csv'))
          if ($summary.Count -ne 2) { throw "Expected 2 worktrees; got $($summary.Count)" }
          if (@($files | Where-Object { $_.RutaRelativa -eq 'tracked.txt' -and $_.Estado -eq 'Diferente de ambas' }).Count -ne 1) {
            throw 'Modified tracked file was not classified correctly'
          }
          if (@($files | Where-Object { $_.RutaRelativa -eq 'local_only.txt' -and $_.Estado -eq 'Nuevo en ambas' }).Count -ne 1) {
            throw 'Untracked local file was not classified correctly'
          }

      - name: Build frontend
        working-directory: frontend/marketplace-ui
        run: npm run build

      # Subir artefactos del build
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/marketplace-ui/dist/
          retention-days: 7


  browser-e2e:
    name: E2E Browser (isolated Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18 # F489: matches actual Neon DEV/legacy PG18; .NET unit test job stays PG15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONNECTION_STRING: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgrespassword"
      ADMIN_EMAIL: "p1-ci-admin@erp.invalid"
      Payments__Provider: "Disabled"
      Payments__EnableMock: "false"
      ASPNETCORE_ENVIRONMENT: "Development"
      PORT: "5000"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Generate one-time local CI auth values
        run: |
          TEST_PASSWORD="$(openssl rand -hex 24)"
          TEST_JWT_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$TEST_PASSWORD"
          echo "::add-mask::$TEST_JWT_KEY"
          echo "ADMIN_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          echo "Jwt__Key=$TEST_JWT_KEY" >> "$GITHUB_ENV"

      - name: Install UI dependencies
        working-directory: frontend/marketplace-ui
        run: npm ci

      - name: Install isolated browser runner
        working-directory: frontend/marketplace-ui
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      # F405: validate 30 physical-size grid slots in Chromium and print-to-PDF,
      # without a physical printer, device, external API or persistent data.
      - name: F405 Avery 5160 print layout (Chromium, virtual PDF only)
        working-directory: frontend/marketplace-ui
        run: node tests/f405-avery-print-layout.mjs
      - name: F406 JsBarcode to ZXing synthetic optical round-trip (Chromium)
        working-directory: frontend/marketplace-ui
        run: node tests/f406-optical-roundtrip.mjs

      - name: F411/F422 scanner keyboard and synthetic camera decode (local Chromium)
        working-directory: frontend/marketplace-ui
        run: node tests/f411-scanner-camera-ui.mjs

      - name: Test real browser with mock API only
        working-directory: frontend/marketplace-ui
        run: node tests/e2e-auth-browser.mjs

      - name: Purchase order multi-item and invoice browser regression
        working-directory: frontend/marketplace-ui
        run: |
          npm run build
          node tests/compras-multi-items.mjs

      - name: F660 supplier registration, duplicate protection and PO selection (mock Chromium)
        working-directory: frontend/marketplace-ui
        run: |
          npm run build
          node tests/proveedores-registro.mjs

      # F355: isolated HTTPS Chromium exercises the opt-in BFF/cookie path.
      # VITE_BFF_AUTH_MODE is scoped to this step ONLY; production deployments
      # and existing CI tests continue using the legacy bearer path.
      - name: Test secure cookie BFF with HTTPS Chromium (mock API only)
        working-directory: frontend/marketplace-ui
        env:
          VITE_BFF_AUTH_MODE: enabled
        run: |
          npm run build
          node tests/e2e-bff-cookie-browser.mjs

      - name: Build .NET API for local full-stack E2E
        run: |
          dotnet restore MarketplaceERP.sln
          dotnet build src/MarketplaceERP.API/MarketplaceERP.API.csproj --configuration Release --no-restore

      # F495: exercise the exact EAN alias/rotation Up/Down and signed-
      # webhook replay migrations against PG18 as well as the PG15 .NET job.
      # Tests create and DROP only their own CI local disposable databases.
      - name: F495 PG18 EAN rotation and bank replay invariants
        env:
          TEST_PG_CONNECTION: ${{ env.CONNECTION_STRING }}
        run: |
          dotnet test tests/MarketplaceERP.Catalog.Tests/MarketplaceERP.Catalog.Tests.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~F451EanReservationsMigrationPgTests" \
            --logger "console;verbosity=minimal"
          dotnet test tests/MarketplaceERP.Finance.Tests/MarketplaceERP.Finance.Tests.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~PostgresSchemaMigrationSmokeTests" \
            --logger "console;verbosity=minimal"

      - name: Migrate and bootstrap disposable PostgreSQL only
        run: |
          DESCRIBE=$(dotnet run --project src/MarketplaceERP.API/MarketplaceERP.API.csproj --configuration Release --no-build --no-launch-profile -- --describe-maintenance-target)
          FP=$(printf '%s\n' "$DESCRIBE" | awk -F ': ' '/Target fingerprint:/{print $2}')
          if ! [[ "$FP" =~ ^[A-F0-9]{64}$ ]]; then
            echo "Invalid maintenance target fingerprint"; exit 1
          fi
          for ACTION in migrate bootstrap-admin; do
            dotnet run --project src/MarketplaceERP.API/MarketplaceERP.API.csproj --configuration Release --no-build --no-launch-profile -- \
              "--maintenance=$ACTION" \
              "--expected-host=localhost" \
              "--expected-port=5432" \
              "--expected-database=postgres" \
              "--confirm-target=$FP"
          done

      - name: Seed F105 two-seller products and physical stock in disposable PostgreSQL
        env:
          TEST_PG_CONNECTION: ${{ env.CONNECTION_STRING }}
          F105_SEED_FIXTURE: "true"
        run: |
          dotnet test tests/MarketplaceERP.Finance.Tests/MarketplaceERP.Finance.Tests.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~F105FixtureSeedTests" \
            --logger "console;verbosity=minimal"

      - name: Enable guarded order evaluation for this CI run only
        run: |
          echo "Orders__StagingEvaluation__Enabled=true" >> "$GITHUB_ENV"
          echo "Orders__StagingEvaluation__ExpiresAtUtc=$(date -u -d '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Start real local ASP.NET API
        run: |
          nohup dotnet run --project src/MarketplaceERP.API/MarketplaceERP.API.csproj \
            --configuration Release --no-build --no-launch-profile \
            > /tmp/p1-local-api.log 2>&1 &
          for i in $(seq 1 100); do
            if curl --silent --fail http://127.0.0.1:5000/health/ready > /dev/null; then
              echo "Local API ready"; exit 0
            fi
            sleep 0.3
          done
          echo "Local API did not become ready"
          tail -n 35 /tmp/p1-local-api.log
          exit 1

      - name: Test real Admin JWT in Chromium + local PostgreSQL
        working-directory: frontend/marketplace-ui
        run: node tests/e2e-live-local-api.mjs

      # F112: independent real-API ownership gate. This never contacts remote Render/Neon.
      - name: F105 two-seller ownership E2E (Chromium, JWT, disposable PostgreSQL)
        working-directory: frontend/marketplace-ui
        env:
          CI: 'true'
          F101_CHROME_CHANNEL: chromium
        run: node tests/f105-live-seller-orders.mjs

      # F381: REAL BFF adapter -> REAL ASP.NET 8 + disposable PostgreSQL.
      # Passwords are ephemeral CI-only; no Vercel/Render/Neon, no payments.
      - name: F381 BFF against real local API (fail closed, no external credentials)
        working-directory: frontend/marketplace-ui
        run: node tests/f381-real-api-bff-smoke.mjs

      # F390: two strict AUTH .NET processes share ONLY disposable localhost DB.
      # No Render, Neon, Vercel, real payments or persistent credentials.
      - name: F390 start two strict-auth API instances (localhost only)
        shell: bash
        run: |
          set -euo pipefail
          for port in 5001 5002; do
            nohup env PORT="$port" Auth__EnableSessionVersionCheck=true \
              Auth__EnableDistributedAccountLoginThrottle=true \
              dotnet run --project src/MarketplaceERP.API/MarketplaceERP.API.csproj \
                --configuration Release --no-build --no-launch-profile \
                > "/tmp/f390-api-$port.log" 2>&1 &
            ready=0
            for i in $(seq 1 120); do
              if curl --silent --fail "http://127.0.0.1:$port/health/ready" > /dev/null; then
                ready=1; break
              fi
              sleep 0.3
            done
            if [ "$ready" != "1" ]; then
              echo "::error::F390 strict local API $port never became ready"
              exit 1
            fi
          done

      - name: F390 cross-instance revocation and account throttle (real API and DB)
        working-directory: frontend/marketplace-ui
        env:
          Auth__EnableSessionVersionCheck: "true"
          Auth__EnableDistributedAccountLoginThrottle: "true"
        run: node tests/f390-two-instance-auth.mjs

  local-worktrees-windows:
    name: Local Git comparator (Windows PowerShell 5.1)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: F315 Vercel policy offline guard (11 scenarios, no network)
        shell: powershell
        run: .\\scripts\\f315-vercel-policy-contract-tests.ps1
      - name: F424 Admin Preview QA helper parse (offline)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script='./scripts/f424-preview-admin-readonly.ps1'
          if(!(Test-Path -LiteralPath $script)){throw 'F424 script absent'}
          $tokens=$null
          $parseErrors=$null
          [Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$parseErrors)|Out-Null
          if($parseErrors.Count){throw 'F424 script parse errors'}
          $content=Get-Content -LiteralPath $script -Raw
          if($content -notmatch 'Read-Host.*-AsSecureString' -or
              $content -notmatch 'F424_BUSINESS_WRITES=0' -or
              $content -notmatch 'marketplaceerp-api-staging.onrender.com'){
            throw 'F424 script safety contract changed'
          }
      - name: Compare two disposable worktrees with absent files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP ('erp-git-windows-' + [Guid]::NewGuid().ToString('N'))
          $testRepo = Join-Path $base 'repo con espacios'
          $linked = Join-Path $base 'worktree con espacios'
          $output = Join-Path $base 'output'
          New-Item -ItemType Directory -Path $testRepo, $output -Force | Out-Null
          git init $testRepo | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          git -C $testRepo config user.email ci@erp.invalid
          git -C $testRepo config user.name 'CI Windows'
          'original' | Set-Content (Join-Path $testRepo 'tracked.txt')
          git -C $testRepo add tracked.txt
          git -C $testRepo commit -m 'baseline' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'baseline commit failed' }
          git -C $testRepo branch candidate
          git -C $testRepo branch staging
          git -C $testRepo worktree add -b linked-worktree $linked HEAD | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'worktree add failed' }
          'changed locally' | Set-Content (Join-Path $testRepo 'tracked.txt')
          'new file only' | Set-Content (Join-Path $linked 'new-only.txt')
          & ./scripts/analizar-cambios-worktrees.ps1 -Repo $testRepo -Destino $output -RamaCandidata candidate -RamaStaging staging
          if (-not $?) { throw 'worktree comparator failed' }
          $report = @(Get-ChildItem -LiteralPath $output -Directory | Sort-Object Name -Descending)[0].FullName
          $rows = @(Import-Csv (Join-Path $report 'Archivos_Comparados.csv'))
          $summary = @(Import-Csv (Join-Path $report 'Resumen_Worktrees.csv'))
          if ($summary.Count -ne 2) { throw "Expected 2 worktrees, got $($summary.Count)" }
          if (@($rows | Where-Object { $_.RutaRelativa -eq 'tracked.txt' -and $_.Estado -eq 'Diferente de ambas' }).Count -ne 1) {
            throw 'Modified tracked file not detected'
          }
          if (@($rows | Where-Object { $_.RutaRelativa -eq 'new-only.txt' -and $_.Estado -eq 'Nuevo en ambas' }).Count -ne 1) {
            throw 'Absent new file was not classified correctly'
          }

  build-marketplace-store:
    name: Marketplace Store · Next.js 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/marketplace-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/marketplace-store/package-lock.json
      - name: Install storefront dependencies
        run: npm ci
      - name: Regenerate ERP seed catalog
        run: npm run catalog:from-erp
      - name: Verify generated catalog is committed
        run: git diff --exit-code -- frontend/marketplace-store/data/catalogo.json
        working-directory: .
      - name: Lint storefront
        run: npm run lint
      - name: Build storefront
        run: npm run build
